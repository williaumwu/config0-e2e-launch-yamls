global:
  arguments:
    aws_default_region: eu-west-1

labels:
  general:
    environment: dev
    purpose: eval-config0
  infrastructure:
    cloud: aws
    area: network

# One stack = one schedule: vpc_rds is a parent stack that brings up the VPC then
# the RDS in a single run. The two selectors below let the RDS substack read the
# VPC's records — vpc_name + private_subnet_ids off the VPC record, db_sg_id off
# the SEPARATE security_group record. Both records are created by vpc_rds's own VPC
# substack within this run, so the selectors skip-and-leave at the Python mint pass
# and resolve at the Go dispatch pass, after the VPC has written back.
#
# Explicit selectors section — named definitions under this key, distinct from
# labels (work order WO-2: restore the original's explicit top-level selectors: key).
selectors:
  network_vars:
    match:
      labels:
        environment: dev
        purpose: eval-config0
        area: network
        region: eu-west-1
        cloud: aws

  sg_vars:
    match:
      filter:
        resource_type: security_group
      labels:
        environment: dev
        purpose: eval-config0
        area: network
        cloud: aws

stacks:
  vpc_rds:
    stack: williaumwu:::config0-e2e-authoring::vpc_rds
    # explicit per-stack label references — the stack names the label groups it
    # wants (target syntax; parser ignores it today — that's fine).
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: eval-config0-vpc-simple
      rds_name: eval-config0-rds
      engine_version: "8.0.46"
      # _hash convention: authored as a dictionary, delivered to the worker as a
      # base64 string via spec.serialization.to_base64 below.
      cloud_tags_hash:
        environment: dev
        purpose: eval-config0
    selectors:
      - network_vars
      - sg_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
