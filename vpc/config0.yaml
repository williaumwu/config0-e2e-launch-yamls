global:
  arguments:
    aws_default_region: eu-west-1

labels:
  general:
    environment: dev
    purpose: eval-config0
  infrastructure:
    cloud: aws
    product: vpc
    area: network

stacks:
  vpc:
    stack: williaumwu:::config0-e2e-authoring::aws_simple_vpc
    # explicit per-stack label references — each stack names the label groups
    # it wants (work order WO-1: the platform must honor this instead of
    # auto-stamping every project label group onto every stack)
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: eval-config0-vpc-simple
      eks_cluster: eval-config0-eks
      base_cidr: "999.999"
      # _hash convention: authored as a dictionary, delivered to the worker as
      # a base64 string via spec.serialization.to_base64 below
      cloud_tags_hash:
        environment: dev
        purpose: eval-config0
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
