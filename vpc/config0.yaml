global:
  arguments:
    aws_default_region: eu-west-1

labels:
  general:
    environment: dev
    purpose: eval-config0
  infrastructure:
    cloud: aws
    product: vpc
    area: network

# Explicit selectors section — named selector definitions live under this key
# (see resource-record-contract.md). vpc_vars matches the vpc resource record
# written by the `vpc` stack below; the nat stack reads vpc_id/public_subnet_ids/
# private_route_table_id off it. filter.resource_type narrows away the separate
# security_group record that carries the same labels.
selectors:
  vpc_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: eval-config0
        area: network
        cloud: aws

stacks:
  vpc:
    stack: williaumwu:::config0-e2e-authoring::aws_simple_vpc
    # explicit per-stack label references — each stack names the label groups
    # it wants (work order WO-1: the platform must honor this instead of
    # auto-stamping every project label group onto every stack)
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: eval-config0-vpc-simple
      eks_cluster: eval-config0-eks
      # _hash convention: authored as a dictionary, delivered to the worker as
      # a base64 string via spec.serialization.to_base64 below
      cloud_tags_hash:
        environment: dev
        purpose: eval-config0
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  nat:
    stack: config0-hub:::aws_networking::aws_nat_inst_vpc
    # explicit stack-level dependency (config0.yaml `dependencies:` key) — the
    # nat stack's selectors read the vpc resource record, so it must run after
    # the vpc stack writes back in this same run.
    dependencies:
      - vpc
    labels:
      - general
      - infrastructure
    arguments:
      service_name: eval-config0-nat
      vpc_id: selector:::vpc_vars::vpc_id
      public_subnet_ids: selector:::vpc_vars::public_subnet_ids:csv
      private_route_table_id: selector:::vpc_vars::private_route_table_id
    selectors:
      - vpc_vars
